<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Shop | {brand}</title>
  <meta name="description" content="Shop engagement rings, wedding bands, fine jewelry and watches. Gold weight and diamond weight listed on every piece. Financing available.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231f3426'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23c8a45a'%3EW%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="js/theme.js?v=202611190304"></script>
  <link rel="stylesheet" href="css/styles.css?v=202611190304">
  <link rel="stylesheet" href="css/heritage.css?v=202611190304">
</head>
<body>
<main>
  <section class="page-head">
    <div class="wrap">
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <h1 id="shopTitle"></h1>
      <p id="shopIntro"></p>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <div class="wrap shop">
    <aside class="filters" id="filters" aria-label="Filters"></aside>
    <section>
      <div class="toolbar">
        <div style="display:flex;align-items:center;gap:14px">
          <button class="btn btn--quiet filter-toggle" id="filterToggle">Filter</button>
          <span id="resultCount"></span>
        </div>
        <label><span class="sr-only">Sort by</span>
          <select class="select" id="sort">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="gold-desc">Gold Weight: Heaviest</option>
            <option value="dia-desc">Diamond Weight: Largest</option>
          </select>
        </label>
      </div>
      <div class="grid grid--3" id="results"></div>
      <p class="fine" style="margin-top:44px">*<span data-fin-disclosure></span> <span data-image-note></span></p>
    </section>
  </div>
</main>

<script src="js/config.js?v=202611190304"></script>
<script src="js/catalog.js?v=202611190304"></script>
<script src="js/image-manifest.js?v=202611190304"></script>
<script src="js/stock-manifest.js?v=202611190304"></script>
<script src="js/site.js?v=202611190304"></script>
<script src="js/shop.js?v=202611190304"></script>
</body>
</html>
