<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Shop | {brand}</title>
  <meta name="description" content="Shop engagement rings, wedding bands, rings, bracelets and chains, each made to order in 10K, 14K or 18K gold. Gold weight and diamond details on every piece. Financing available.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231f3426'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23c8a45a'%3EW%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="js/theme.js?v=202611190507"></script>
  <link rel="stylesheet" href="css/styles.css?v=202611190507">
  <link rel="stylesheet" href="css/heritage.css?v=202611190507">
</head>
<body>
<main>
  <section class="page-head">
    <div class="wrap">
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <h1 id="shopTitle"></h1>
      <p id="shopIntro"></p>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <div class="wrap shop">
    <section>
      <div class="toolbar">
        <div class="applied" id="applied"></div>
        <span class="count" id="resultCount"></span>
        <div class="tools">
          <button type="button" class="tool" id="filterToggle" aria-expanded="false" aria-controls="filters"><span>Filter</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></svg><b id="filterCount"></b></button>
          <label class="tool tool--sort"><span>Sort</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
            <select class="select" id="sort" aria-label="Sort by">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="gold-desc">Gold Weight: Heaviest</option>
              <option value="dia-desc">Diamond Weight: Largest</option>
            </select>
          </label>
        </div>
      </div>
      <div class="fpanel" id="filters" hidden></div>
      <div class="grid grid--3" id="results"></div>
      <p class="fine" style="margin-top:44px">*<span data-fin-disclosure></span> <span data-image-note></span></p>
    </section>
  </div>
</main>

<script src="js/config.js?v=202611190507"></script>
<script src="js/catalog.js?v=202611190507"></script>
<script src="data/gold.js"></script>
<script src="js/pricing.js?v=202611190507"></script>
<script src="js/image-manifest.js?v=202611190507"></script>
<script src="js/stock-manifest.js?v=202611190507"></script>
<script src="js/site.js?v=202611190507"></script>
<script src="js/shop.js?v=202611190507"></script>
</body>
</html>
